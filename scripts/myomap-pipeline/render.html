<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const data = await (await fetch('meshes.json')).json();
const tend = await (await fetch('tendon.json')).json();
const b64 = (s, T) => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new T(u.buffer); };
const geos = data.map(p => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(b64(p.pos, Float32Array),3)); g.setIndex(new THREE.BufferAttribute(b64(p.idx, Uint32Array),1)); g.computeVertexNormals(); return {name:p.name, system:p.system, g}; });
window.names = data.map(p=>p.name);
window.renderView = (v, mode) => {
  const W = Math.round((v.x1-v.x0)*v.ppm), H = Math.round((v.y1-v.y0)*v.ppm);
  const r = new THREE.WebGLRenderer({antialias: mode==='shade', preserveDrawingBuffer:true, alpha:true});
  r.setPixelRatio(1); r.setSize(W,H); r.setClearColor(0x000000, 0);
  r.outputColorSpace = mode==='shade' ? THREE.SRGBColorSpace : THREE.LinearSRGBColorSpace;
  if (mode==='tendon') r.outputColorSpace = THREE.LinearSRGBColorSpace;
  const scene = new THREE.Scene();
  const cx=(v.x0+v.x1)/2, cy=(v.y0+v.y1)/2, hw=(v.x1-v.x0)/2, hh=(v.y1-v.y0)/2;
  const cam = new THREE.OrthographicCamera(-hw,hw,hh,-hh,0.01,10);
  const dz = v.from==='front'?1:-1;
  cam.position.set(cx,cy,dz*3); cam.up.set(0,1,0); cam.lookAt(cx,cy,0);
  geos.forEach((o,i)=>{
    const isSkin = o.name==='Skin';
    if (mode==='skin' ? !isSkin : isSkin) return;
    if (v.exclude && v.exclude.includes(o.name)) return;
    let m;
    if (mode==='tendon') {
      const flags = tend[o.name] ? b64(tend[o.name], Uint8Array) : null;
      const n = o.g.attributes.position.count; const col = new Float32Array(n*3);
      for (let k=0;k<n;k++){ const tf = flags ? flags[k] : 0; col[k*3] = tf; col[k*3+1] = flags ? 1-tf : 0; col[k*3+2]=0; }
      const g2 = o.g.clone(); g2.setAttribute('color', new THREE.BufferAttribute(col,3));
      scene.add(new THREE.Mesh(g2, new THREE.MeshBasicMaterial({vertexColors:true}))); return;
    }
    if (mode==='shade') m = new THREE.MeshStandardMaterial({color: o.system==='skeletal'?0xffffff:0xffffff, roughness:0.8, metalness:0});
    else { const id=i+1; m = new THREE.MeshBasicMaterial({color: new THREE.Color().setRGB((id&255)/255, ((id>>8)&255)/255, 0, THREE.LinearSRGBColorSpace)}); }
    scene.add(new THREE.Mesh(o.g, m));
  });
  if (mode==='shade') {
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a93a3, 0.9));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(cx-0.6*dz, cy+0.9, dz*1.6); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xffffff, 0.35); d2.position.set(cx+0.8*dz, cy-0.3, dz*1.0); scene.add(d2);
  }
  r.render(scene, cam);
  const url = r.domElement.toDataURL('image/png'); r.dispose(); return {url, W, H};
};
window.ready = true;
</script></body></html>
